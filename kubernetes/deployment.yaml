apiVersion: apps/v1

kind: Deployment

metadata:
  name: ai-platform

  namespace: ai-platform

spec:

  replicas: 2

  selector:

    matchLabels:

      app: ai-platform

  template:

    metadata:

      labels:

        app: ai-platform

    spec:

      containers:

      - name: ai-platform

        image: nginx:latest

        ports:

        - containerPort: 80
