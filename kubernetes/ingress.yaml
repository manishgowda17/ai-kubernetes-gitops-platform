apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: ai-platform-ingress
  namespace: ai-platform

spec:

  rules:

  - host: ai-platform.local

    http:

      paths:

      - path: /
        pathType: Prefix

        backend:

          service:

            name: ai-platform-service

            port:

              number: 80
